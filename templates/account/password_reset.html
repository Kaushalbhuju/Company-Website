{% extends "account/base.html" %}
{% load static %}

{% block content %}
<div class="password-reset-container">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title">Password Reset</h2>
            <p class="card-text">
                Forgotten your password? Enter your email address below, and we'll send you an email allowing you to reset it.
            </p>
            
            <form method="POST" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Reset My Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/accounts.css' %}">
<style>
    .password-reset-container {
        max-width: 500px;
        margin: 2rem auto;
        padding: 1rem;
    }
</style>
{% endblock %}
